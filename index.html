<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Camilan Lezat</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: #f8fafc; margin: 0; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { margin-bottom: 5px; color: #1e293b; }
    .header p { color: #64748b; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 8px; color: #0f172a; }
    .card-price { font-size: 1.2rem; font-weight: bold; color: #16a34a; margin-bottom: 15px; }
    .btn-buy { margin-top: auto; background-color: #25d366; color: white; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; display: block; }
    .btn-buy:hover { background-color: #1eb954; }
  </style>
</head>
<body>

  <header class="header">
    <h1>Toko Camilan Gurih</h1>
    <p>Pesan langsung via WhatsApp, cepat & praktis</p>
  </header>

  <main class="grid">
    <!-- PRODUK 1 (Tinggal ganti foto, nama, harga, dan link WA) -->
    <div class="card">
      <img src="makroni.jpg" alt="Makroni Pedas">
      <div class="card-body">
        <h2 class="card-title">Makroni Pedas Daun Jeruk</h2>
        <div class="card-price">Rp15.000</div>
        <a class="btn-buy" href="https://wa.me/6281234567890?text=Halo%20saya%20mau%20pesan%20Makroni%20Pedas">
          Beli via WhatsApp
        </a>
      </div>
    </div>

    <!-- PRODUK 2 -->
    <div class="card">
      <img src="makroni.jpg" alt="Makroni Gurih">
      <div class="card-body">
        <h2 class="card-title">Makroni Gurih Original</h2>
        <div class="card-price">Rp15.000</div>
        <a class="btn-buy" href="https://wa.me/6281234567890?text=Halo%20saya%20mau%20pesan%20Makroni%20Gurih">
          Beli via WhatsApp
        </a>
      </div>
    </div>
  </main>

</body>
</html>
